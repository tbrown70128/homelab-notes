# Turn kernel lockups into an automatic reboot instead of a silent freeze (2026-11-28).
# Backup for the iTCO hardware watchdog, which failed to reset the 2026-11-28 freeze.
# softlockup: a CPU stuck in the kernel for ~20 s. hardlockup: stuck with interrupts
# off (NMI watchdog). oops: leaves the system half-broken. Reboot 10 s after a panic.
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
kernel.panic_on_oops = 1
kernel.panic = 10
